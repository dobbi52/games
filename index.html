<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>생각 오락실</title>
<style>
  @font-face { font-family: 'Galmuri11'; src: url('https://cdn.jsdelivr.net/npm/galmuri@2.40.3/dist/Galmuri11.woff2') format('woff2'); font-display: swap; }
  @font-face { font-family: 'Galmuri11'; font-weight: 700; src: url('https://cdn.jsdelivr.net/npm/galmuri@2.40.3/dist/Galmuri11-Bold.woff2') format('woff2'); font-display: swap; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    word-break: keep-all;
    overflow-wrap: break-word;
    font-family: 'Galmuri11', monospace;
    background: #14112b;
    background-image:
      linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);
    background-size: 24px 24px;
    color: #f2f0ff;
    min-height: 100vh;
    padding: 44px 16px 56px;
    -webkit-font-smoothing: none;
  }
  body::after {
    content: ''; position: fixed; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(transparent 0 2px, rgba(0,0,0,.18) 2px 4px);
  }
  .wrap { max-width: 720px; margin: 0 auto; }
  @media (min-width: 900px) {
    .wrap { max-width: 980px; }
    .list { grid-template-columns: repeat(3, 1fr) !important; }
  }
  .hud { display: flex; justify-content: space-between; font-size: 14px; color: #8f88c9; margin-bottom: 30px; }
  .hud b { color: #ffd84a; font-weight: 400; }
  .hud { align-items: center; }
  .hud-r { display: flex; align-items: center; gap: 14px; }

  /* 1P 로그인 버튼 */
  .p1-btn {
    font: inherit; font-size: 13px; font-weight: 700; cursor: pointer; max-width: 150px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    background: #1f1a45; color: #6ef2d3; border: 3px solid #6ef2d3; padding: 7px 10px;
    box-shadow: 3px 3px 0 #0a0818, 0 0 10px rgba(110, 242, 211, .35);
  }
  .p1-btn.in { color: #ffd84a; border-color: #ffd84a; box-shadow: 3px 3px 0 #0a0818, 0 0 10px rgba(255, 216, 74, .35); }
  .p1-btn:hover, .p1-btn:focus-visible { transform: translate(-2px, -2px); box-shadow: 5px 5px 0 #0a0818; outline: none; }

  /* 통합 계정 안내 */
  .notice {
    max-width: 600px; margin: -14px auto 30px; padding: 12px 14px; text-align: center;
    border: 3px dashed #ffd84a; background: rgba(255, 216, 74, .07);
    font-size: 14px; line-height: 1.7; color: #f2f0ff;
  }
  .notice b { color: #ffd84a; }
  .notice .ch { display: inline-block; }
  .notice br.m { display: none; }
  .notice button {
    font: inherit; font-size: 13px; font-weight: 700; cursor: pointer; margin-left: 6px;
    background: #ffd84a; color: #14112b; border: 0; padding: 3px 9px; box-shadow: 2px 2px 0 #0a0818;
  }
  .need {
    position: absolute; bottom: -12px; left: 50%; transform: translateX(-50%); z-index: 2;
    font-size: 11px; font-weight: 700; white-space: nowrap; padding: 2px 7px;
    background: #14112b; color: var(--c); border: 2px solid var(--c);
  }
  .need-note { margin-top: 12px; font-size: 13px; color: #bdb7e6; }
  .need-note b { color: #ffd84a; }

  /* QR 버튼 (작게) */
  .qr-btn {
    position: relative; cursor: pointer; padding: 4px;
    background: #fff4c2; border: 3px solid #ffd84a;
    box-shadow: 3px 3px 0 #0a0818, 0 0 12px rgba(255, 216, 74, .45);
    line-height: 0;
  }
  .qr-btn canvas { width: 38px; height: 38px; image-rendering: pixelated; }
  .qr-btn i {
    position: absolute; left: 50%; bottom: -9px; transform: translateX(-50%);
    font: 700 10px 'Galmuri11', monospace; font-style: normal; line-height: 1;
    background: #e2457a; color: #fff; padding: 2px 4px;
  }
  .qr-btn:hover, .qr-btn:focus-visible { transform: translate(-2px, -2px); box-shadow: 5px 5px 0 #0a0818, 0 0 18px #ffd84a; outline: none; }

  /* QR 크게 보기 */
  .qr-panel { --c: #ffd84a; max-width: 380px; }
  .qr-panel h2 { color: #ffd84a; letter-spacing: .06em; margin-top: 0; }
  .qr-panel .sub { margin-top: 8px; font-size: 14px; color: #bdb7e6; }
  .qr-frame {
    position: relative; margin: 20px auto 0; width: fit-content;
    background: #fff4c2; padding: 10px; border: 4px solid #ffd84a;
    box-shadow: 6px 6px 0 #0a0818, 0 0 24px rgba(255, 216, 74, .5);
  }
  .qr-frame canvas { display: block; width: 240px; height: 240px; image-rendering: pixelated; }
  .qr-frame::before, .qr-frame::after {           /* 오락기 화면 모서리 장식 */
    content: ''; position: absolute; width: 14px; height: 14px; border: 4px solid #e2457a;
  }
  .qr-frame::before { top: -12px; left: -12px; border-right: 0; border-bottom: 0; }
  .qr-frame::after { bottom: -12px; right: -12px; border-left: 0; border-top: 0; }
  .qr-url { margin-top: 18px; font-size: 12px; color: #8f88c9; word-break: break-all; }
  .qr-insert { margin-top: 10px; font-size: 15px; color: #6ef2d3; animation: blink 1.1s steps(1) infinite; }
  header { text-align: center; margin-bottom: 40px; }
  h1 {
    font-weight: 700;
    font-size: clamp(36px, 8.5vw, 56px);
    color: #ffd84a;
    text-shadow: 4px 4px 0 #e2457a, 8px 8px 0 #3a2a8c;
    letter-spacing: .02em;
    line-height: 1.25;
  }
  .press { margin-top: 18px; font-size: 18px; color: #6ef2d3; animation: blink 1.1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  .tabs { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-bottom: 34px; }
  .tab {
    font: inherit; font-size: 16px; font-weight: 700; cursor: pointer;
    background: #1f1a45; color: #bdb7e6;
    border: 3px solid #3a3470; padding: 9px 16px;
    box-shadow: 4px 4px 0 #0a0818;
  }
  .tab small { font-size: 13px; font-weight: 400; color: #8f88c9; margin-left: 4px; }
  .tab:hover { border-color: #6ef2d3; color: #f2f0ff; }
  .tab.on { background: #6ef2d3; border-color: #6ef2d3; color: #14112b; transform: translate(2px, 2px); box-shadow: 2px 2px 0 #0a0818; }
  .tab.on small { color: #14112b; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .chips span { font-size: 12px; color: #d9d4ff; border: 2px solid #3a3470; background: #0d0b20; padding: 3px 8px; }
  .chips span::before { content: '#'; color: var(--c); margin-right: 2px; }
  .empty { text-align: center; color: #8f88c9; padding: 30px 0; }
  .list { display: grid; grid-template-columns: repeat(2, 1fr); gap: 30px 22px; }
  .cab {
    font: inherit; cursor: pointer; text-align: center;
    display: flex; flex-direction: column; align-items: center;
    background: #1f1a45; color: inherit;
    padding: 30px 16px 20px;
    border: 4px solid var(--c);
    box-shadow: 6px 6px 0 #0a0818, 0 0 18px color-mix(in srgb, var(--c) 45%, transparent);
    position: relative;
  }
  .cab:hover, .cab:focus-visible { transform: translate(-2px, -2px); box-shadow: 8px 8px 0 #0a0818, 0 0 26px var(--c); outline: none; }
  .cab:active { transform: translate(2px, 2px); box-shadow: 3px 3px 0 #0a0818; }
  .grade {
    display: inline-block; margin-top: 10px;
    font-size: 13px; font-weight: 700; color: #ffd84a;
    border: 2px solid #ffd84a; background: rgba(255, 216, 74, .1);
    padding: 3px 10px; box-shadow: 2px 2px 0 #0a0818;
  }
  .grade::before { content: '★ '; font-size: 11px; }
  .cab .grade + .chips { margin-top: 10px; }
  .panel .grade { margin-top: 12px; }
  .no i { font-style: normal; }
  .badges { position: absolute; top: -14px; right: 14px; z-index: 2; display: flex; gap: 5px; }
  .badge {
    font-size: 12px; font-weight: 700; padding: 3px 8px; white-space: nowrap;
    box-shadow: 3px 3px 0 #0a0818;
  }
  .b-today { background: #ff4d6d; color: #fff; animation: badgePulse 1s steps(2) infinite; }
  .b-hot { background: #ff8a3d; color: #14112b; }
  .b-hot::before { content: '▲ '; }
  .b-new { background: #6ef2d3; color: #14112b; }
  @keyframes badgePulse { 50% { background: #ffd84a; color: #14112b; } }
  .no { position: absolute; top: -14px; left: 16px; background: var(--c); color: #14112b; font-size: 13px; font-weight: 700; padding: 3px 10px; }
  .thumb {
    flex-shrink: 0; width: 104px; height: 104px;
    background: #0d0b20; border: 3px solid #3a3470;
    display: grid; place-items: center;
  }
  .name { font-size: 24px; font-weight: 700; margin-top: 16px; }
  .cab .chips { justify-content: center; }
  .chips.one { flex-wrap: nowrap; max-width: 100%; overflow: hidden; }
  .chips.one span { flex: 0 0 auto; }


  /* 게임 안내 창 */
  .dim { position: fixed; inset: 0; z-index: 10; background: rgba(8, 6, 20, .78); display: none; place-items: center; padding: 16px; }
  .dim.open { display: grid; }
  .panel {
    width: 100%; max-width: 440px; max-height: calc(100vh - 32px); overflow-y: auto;
    background: #1f1a45; border: 4px solid var(--c);
    box-shadow: 8px 8px 0 #0a0818, 0 0 30px color-mix(in srgb, var(--c) 55%, transparent);
    padding: 34px 24px 26px; position: relative; text-align: center;
    animation: pop .16s steps(3);
  }
  @keyframes pop { from { transform: scale(.9); opacity: 0; } }
  .panel .no { top: 14px; left: 14px; }
  .panel { padding-top: 58px; }
  .x {
    position: absolute; top: 12px; right: 12px; font: inherit; font-size: 15px; font-weight: 700; cursor: pointer;
    width: 34px; height: 34px; background: #0d0b20; color: #bdb7e6; border: 3px solid #3a3470;
  }
  .x:hover { color: #fff; border-color: var(--c); }
  .panel .thumb { margin: 0 auto; width: 120px; height: 120px; }
  .panel h2 { font-size: 28px; margin-top: 16px; }
  .kind { margin-top: 8px; font-size: 14px; color: var(--c); }
  .about {
    margin-top: 18px; padding: 14px 16px; text-align: left;
    background: #0d0b20; border: 3px solid #3a3470;
    font-size: 15px; line-height: 1.75; color: #d9d4ff;
  }
  .panel .chips { justify-content: center; margin-top: 14px; }
  .start {
    display: block; margin-top: 22px; text-decoration: none;
    font-size: 20px; font-weight: 700; color: #14112b; background: var(--c);
    padding: 15px; box-shadow: 5px 5px 0 #0a0818;
  }
  .start::before { content: '▶'; display: inline-block; margin-right: 10px; }
  .start { position: relative; overflow: hidden; transition: transform .12s steps(2), box-shadow .12s steps(2), filter .12s; }
  .start::after {                       /* 반짝 지나가는 빛 */
    content: ''; position: absolute; top: 0; bottom: 0; left: -70px; width: 46px;
    background: rgba(255, 255, 255, .55); transform: skewX(-20deg); pointer-events: none;
  }
  .start:hover, .start:focus-visible {
    transform: translate(-3px, -3px); outline: none;
    box-shadow: 8px 8px 0 #0a0818, 0 0 26px var(--c), 0 0 0 3px #fff inset;
    filter: brightness(1.12);
  }
  .start:hover::before, .start:focus-visible::before { animation: nudge .45s steps(2) infinite; }
  .start:hover::after, .start:focus-visible::after { animation: shine .6s steps(8) both; }
  @keyframes nudge { 50% { transform: translateX(6px); } }
  @keyframes shine { to { left: calc(100% + 30px); } }
  .start:active { transform: translate(3px, 3px); box-shadow: 2px 2px 0 #0a0818; }
  .score b.done { animation: scoreHit .5s steps(2) 2; }
  @keyframes scoreHit { 50% { color: #fff; text-shadow: 0 0 12px #ffd84a, 0 0 2px #fff; } }
  .score { display: flex; justify-content: center; gap: 10px; margin-top: 20px; }
  .score[hidden] { display: none; }
  .score div {
    background: #0d0b20; border: 2px solid #3a3470; box-shadow: 3px 3px 0 #0a0818;
    padding: 4px 11px; display: flex; align-items: baseline; gap: 7px;
  }
  .score span { font-size: 11px; color: #8f88c9; }
  .score b { font-size: 16px; color: #ffd84a; letter-spacing: .08em; text-shadow: 0 0 6px rgba(255, 216, 74, .45); }
  footer { text-align: center; margin-top: 44px; font-size: 14px; color: #8f88c9; }
  footer b { color: #6ef2d3; font-weight: 400; animation: blink 1.1s steps(1) infinite; }

  /* 빈칸을 채우는 COMING SOON 카드 (누를 수 없어요) */
  .cab.soon { cursor: default; justify-content: center; border-style: dashed; background: rgba(31, 26, 69, .55); }
  .cab.soon:hover, .cab.soon:active { transform: none; box-shadow: 6px 6px 0 #0a0818, 0 0 18px color-mix(in srgb, var(--c) 45%, transparent); }
  .soon .thumb { border-style: dashed; border-color: color-mix(in srgb, var(--c) 55%, #3a3470); }
  .soon .q { font-size: 56px; font-weight: 700; line-height: 1; color: var(--c); text-shadow: 0 0 12px var(--c); animation: blink 1.4s steps(1) infinite; }
  .soon .name { color: #bdb7e6; }
  .soon .wait {
    display: inline-block; margin-top: 10px; font-size: 13px; font-weight: 700; color: var(--c);
    border: 2px dashed var(--c); padding: 3px 10px;
  }
  .soon .wait b { font-weight: 400; animation: blink 1.1s steps(1) infinite; }
  .soon .hint { margin-top: 10px; font-size: 12px; color: #8f88c9; }

  .tiles { display: grid; grid-template-columns: repeat(3, 24px); gap: 5px; }
  .tiles span { width: 24px; height: 24px; display: grid; place-items: center; font-size: 14px; font-weight: 700; color: #14112b; }
  .t-g { background: #6ef28a; } .t-y { background: #ffd84a; } .t-n { background: #6d6894; }
  .grid4 { display: grid; grid-template-columns: repeat(4, 20px); gap: 2px; }
  .grid4 span { width: 20px; height: 20px; display: grid; place-items: center; font-size: 12px; }
  .m24 { display: grid; grid-template-columns: repeat(2, 30px); gap: 5px; position: relative; }
  .m24 span { width: 30px; height: 30px; display: grid; place-items: center; font-size: 16px; font-weight: 700; color: #14112b; background: #ffd84a; box-shadow: 2px 2px 0 #b8901a; }
  .m24 span:nth-child(2), .m24 span:nth-child(3) { background: #ff7aa8; box-shadow: 2px 2px 0 #b8456c; }
  .m24 b { position: absolute; right: -14px; bottom: -12px; background: #6ef2d3; color: #14112b; font-size: 13px; padding: 1px 4px; box-shadow: 2px 2px 0 #0a0818; }
  .beat { width: 72%; height: auto; display: block; }
  .xylo { display: flex; align-items: center; gap: 4px; }
  .bldg { display: flex; align-items: flex-end; gap: 3px; }
  .bldg img { width: 21px; height: auto; display: block; image-rendering: pixelated; }
  .hg { display: flex; align-items: center; justify-content: center; gap: 1px; max-width: 92px; }
  .hg img { width: 38px; height: 38px; object-fit: contain; image-rendering: pixelated; flex: none; }
  .hg b { font-size: 10px; color: #ffd84a; flex: none; }
  .bg-fish img { width: 76px; height: auto; display: block; image-rendering: pixelated; }
  .xylo span { width: 13px; height: var(--h); background: var(--b); color: #14112b; font-size: 10px; font-weight: 700;
    display: flex; align-items: flex-end; justify-content: center; padding-bottom: 3px; box-shadow: 2px 2px 0 #0a0818; }
  .pair { display: grid; grid-template-columns: repeat(3, 24px); gap: 4px; }
  .pair span { width: 24px; height: 24px; display: grid; place-items: center; font-size: 14px; font-weight: 700; color: #d9f2ff; background: #24406b; border: 2px solid #3a6aa8; }
  .pair span.on { background: #5ec8ff; border-color: #bfeaff; color: #14112b; }
  @media (max-width: 600px) {
    .no { font-size: 11px; left: 8px; padding: 3px 6px; }
    .cab .no i { display: none; }   /* 휴대폰 카드에서는 번호만 (배지 자리 확보) */
    .badges { right: 6px; gap: 3px; }
    .badge { font-size: 10px; padding: 3px 5px; }
    /* 휴대폰: 윗부분 줄이기 */
    .hud { font-size: 12px; margin-bottom: 18px; }
    .qr-btn { display: none; }   /* 휴대폰에서는 QR 버튼 숨김 */
    .p1-btn { font-size: 12px; padding: 6px 8px; max-width: 120px; }
    .notice { font-size: 13px; margin: -6px 0 22px; padding: 10px 8px; line-height: 1.75; }
    .notice br.m { display: inline; }
    .notice button { margin: 6px 0 0; }
    .need { font-size: 10px; padding: 1px 5px; bottom: -11px; }
    header { margin-bottom: 20px; }
    .press { margin-top: 12px; font-size: 16px; }
    .press-more { display: none; }
    .tabs { flex-wrap: nowrap; justify-content: flex-start; overflow-x: auto; gap: 5px;
            margin: 0 -16px 26px; padding: 0 16px 8px; scrollbar-width: none; }
    .tabs::-webkit-scrollbar { display: none; }
    .tab { flex: 0 0 auto; font-size: 13px; padding: 7px 7px; box-shadow: 3px 3px 0 #0a0818; }
    .tab small { font-size: 11px; margin-left: 2px; }
    .tabs::before, .tabs::after { content: ''; flex: 1 0 0; }   /* 한 줄에 들어가면 가운데 정렬 */
    .pair { grid-template-columns: repeat(3, 21px); }
    .pair span { width: 21px; height: 21px; font-size: 12px; }
    body { padding-top: 28px; }
    .list { gap: 26px 14px; }
    .cab { padding: 26px 6px 16px; }
    .chips.one { gap: 4px; }
    .chips.one span { padding: 2px 4px; }
    .thumb { width: 84px; height: 84px; }
    .tiles { grid-template-columns: repeat(3, 20px); gap: 4px; }
    .tiles span { width: 20px; height: 20px; font-size: 12px; }
    .grid4 { grid-template-columns: repeat(4, 17px); }
    .grid4 span { width: 17px; height: 17px; font-size: 10px; }
    .m24 { grid-template-columns: repeat(2, 26px); }
    .m24 span { width: 26px; height: 26px; font-size: 14px; }
    .name { font-size: 18px; margin-top: 12px; }
    .chips span { font-size: 11px; padding: 2px 6px; }
    .grade { font-size: 12px; padding: 2px 8px; margin-top: 8px; }
    .panel .thumb { width: 104px; height: 104px; }
    .xylo { gap: 3px; }
    .xylo span { width: 11px; font-size: 9px; }
    .bldg { gap: 2px; }
    .bldg img { width: 15px; }
    .hg { max-width: 74px; }
    .hg img { width: 31px; height: 31px; }
    .hg b { font-size: 9px; }
    .panel .bldg img { width: 21px; }
    .panel .hg { max-width: 92px; }
    .panel .hg img { width: 38px; height: 38px; }
    /* 휴대폰: 카드를 줄여 한 화면에 더 많이 */
    .list { gap: 22px 12px; }
    .cab { padding: 20px 6px 14px; }
    .cab .thumb { width: 64px; height: 64px; }
    .cab .thumb > * { transform: scale(.78); }
    .cab .name { font-size: 16px; margin-top: 8px; line-height: 1.25; }
    .cab .grade { font-size: 11px; margin-top: 6px; padding: 1px 6px; }
    .cab .grade + .chips { margin-top: 6px; }
    .cab .chips span { font-size: 10px; }
  }
  .q1 { background: #9b6cff; } .q2 { background: #ff6c9e; } .q3 { background: #3fd6a8; } .q4 { background: #ffb84a; }

  /* ===== 애니메이션 ===== */
  /* 1) 제목이 위에서 떨어지며 튕기기 */
  h1 { animation: drop .8s cubic-bezier(.3, 1.4, .5, 1) both; }
  @keyframes drop {
    0% { transform: translateY(-140px); opacity: 0; }
    55% { transform: translateY(10px); opacity: 1; }
    75% { transform: translateY(-5px); }
    100% { transform: none; }
  }
  /* 2) 카드가 차례로 전원이 켜지듯 나타나기 */
  .cab { animation: boot .55s steps(6) backwards; animation-delay: calc(.35s + var(--n) * .12s); }
  @keyframes boot {
    0% { transform: scale(.2, .03); opacity: 0; filter: brightness(3); }
    40% { transform: scale(1, .03); opacity: 1; filter: brightness(3); }
    75% { transform: scale(1, 1.05); filter: brightness(1.4); }
    100% { transform: none; filter: none; }
  }
  /* 3) 네온 테두리 은은하게 깜빡이기 */
  .cab::after {
    content: ''; position: absolute; inset: -4px; pointer-events: none;
    box-shadow: 0 0 22px 2px var(--c);
    opacity: .25; animation: glow 2.8s ease-in-out infinite;
    animation-delay: calc(var(--n) * -.6s);
  }
  @keyframes glow { 50% { opacity: .6; } }
  /* 4) 안내 창이 화면 가운데에서 확 커지며 열리기 */
  .dim.open { animation: fadeIn .2s both; }
  @keyframes fadeIn { from { opacity: 0; } }
  .dim.open .panel { animation: crt .34s steps(7) both; }
  @keyframes crt {
    0% { transform: scale(.1, .02); opacity: 0; }

// ▼ 탭 순서 (게임이 있는 교과만 화면에 나타나요)
const ORDER = ["국어", "수학", "사회", "과학", "영어", "음악", "미술", "체육", "생각 놀이"];

const AA = window.ArcadeAuth || null;   // 통합 계정 (arcade-auth.js)

const subjects = ORDER.filter(s => games.some(g => g.subjects.includes(s)))
  .concat([...new Set(games.flatMap(g => g.subjects))].filter(s => !ORDER.includes(s)));
let current = decodeURIComponent(location.hash.slice(1));
if (!subjects.includes(current)) current = "전체";

const gradeLabel = g => g.grade ? (g.grade[0] === g.grade[1] ? `${g.grade[0]}학년` : `${g.grade[0]}~${g.grade[1]}학년`) : "";
const gradeHTML = g => g.grade ? `<div class="grade">${gradeLabel(g)}</div>` : "";
function render() {
  const tabs = ["전체", ...subjects];
  document.getElementById("tabs").innerHTML = tabs.map(t => {
    const n = t === "전체" ? games.length : games.filter(g => g.subjects.includes(t)).length;
    return `<button class="tab${t === current ? " on" : ""}" data-t="${t}">${t}<small>${n}</small></button>`;
  }).join("");
  const shown = games.map((g, i) => ({ g, i })).filter(({ g }) => current === "전체" || g.subjects.includes(current));
  document.getElementById("list").innerHTML = shown.length ? shown.map(({ g, i }, k) => `
  <button class="cab" data-i="${i}" style="--c:${g.color};--n:${k}">
    <span class="no"><i>GAME </i>${String(i + 1).padStart(2, "0")}</span>
    <div class="thumb">${g.thumb || "🎮"}</div>
    <div class="name">${g.name}</div>
    ${gradeHTML(g)}
    ${g.tags && g.tags.length ? `<div class="chips one">${g.tags.slice(0, 2).map(t => `<span>${t}</span>`).join("")}</div>` : ""}
    ${g.login && AA ? `<span class="need">1P LOGIN</span>` : ""}
  </button>`).join("") : `<p class="empty">아직 게임이 없어요</p>`;
  // ▼ '전체' 탭에서 마지막 줄의 빈칸을 COMING SOON 카드로 채우기 (한 줄 칸 수: 큰 화면 3 / 작은 화면 2)
  const cols = matchMedia("(min-width: 900px)").matches ? 3 : 2;
  const gap = current === "전체" ? (cols - games.length % cols) % cols : 0;
  const SOON_COLORS = ["#8f88c9", "#6f9fd8"];
  if (gap) document.getElementById("list").insertAdjacentHTML("beforeend", Array.from({ length: gap }, (_, j) => `
  <div class="cab soon" style="--c:${SOON_COLORS[j % 2]};--n:${shown.length + j}" aria-label="새 게임 준비 중">
    <span class="no"><i>GAME </i>${String(games.length + j + 1).padStart(2, "0")}</span>
    <div class="thumb"><span class="q">?</span></div>
    <div class="name">준비 중</div>
    <div class="wait">COMING SOON <b>_</b></div>
    <div class="hint">곧 새 게임이 와요!</div>
  </div>`).join(""));
  document.querySelector("footer").hidden = gap > 0;   // 카드에 안내가 있으니 아래 문구는 숨김
  applyBadges();
  fitTags();
}

// ▼ 카드 태그는 한 줄에 2개: 넘치면 글자를 조금씩 줄여서 맞추기
function fitTags() {
  document.querySelectorAll(".chips.one").forEach(row => {
    row.style.fontSize = "";
    const tags = [...row.children];
    tags.forEach(t => t.style.fontSize = "");
    let size = parseFloat(getComputedStyle(tags[0]).fontSize);
    while (row.scrollWidth > row.clientWidth + 1 && size > 8) {
      size -= 0.5;
      tags.forEach(t => { t.style.fontSize = size + "px"; t.style.paddingLeft = t.style.paddingRight = (size < 10 ? 3 : 4) + "px"; });
    }
  });
}
addEventListener("resize", () => { clearTimeout(fitTags.t); fitTags.t = setTimeout(fitTags, 120); });
if (document.fonts) document.fonts.ready.then(fitTags);

// ▼ 인기 배지: 해당하는 배지를 모두 붙여요 (TODAY'S BEST · HOT · NEW)
let badgeInfo = { todayBest: null, hot: [] };
function badgesOf(g) {
  const out = [];
  if (badgeInfo.todayBest === g.name) out.push(["today", "TODAY'S BEST", "BEST"]);
  if ((badgeInfo.hot || []).includes(g.name)) out.push(["hot", "HOT", "HOT"]);
  if (g.added) {
    const days = (Date.parse(new Date().toLocaleDateString("sv-SE", { timeZone: "Asia/Seoul" })) - Date.parse(g.added)) / 864e5;
    if (days >= 0 && days < 7) out.push(["new", "NEW", "NEW"]);
  }
  return out;
}
function applyBadges() {
  document.querySelectorAll(".cab:not(.soon)").forEach(c => {
    const old = c.querySelector(".badges"); if (old) old.remove();
    const list = badgesOf(games[+c.dataset.i]);
    if (!list.length) return;
    c.insertAdjacentHTML("beforeend", `<span class="badges">${list.map(b =>
      `<span class="badge b-${b[0]}" data-short="${b[2]}">${b[1]}</span>`).join("")}</span>`);
    // 카드가 좁아 GAME 번호와 겹치면 TODAY'S BEST → BEST 로 줄이기
    const box = c.querySelector(".badges"), no = c.querySelector(".no");
    if (box.offsetLeft < no.offsetLeft + no.offsetWidth + 4)       // 애니메이션 중에도 정확하도록 offset 사용
      box.querySelectorAll(".badge").forEach(b => b.textContent = b.dataset.short);
  });
}
const $ = id => document.getElementById(id);

// ▼ 방문 기록: Apps Script 웹 앱 주소를 따옴표 안에 붙여 넣으세요. 비워 두면 점수판이 숨겨져요.
const STATS_URL = "https://script.google.com/macros/s/AKfycbx15D4z15tGhs9bwd_q1EVMZJI1dUk3DV0gqhj1NR81I4c682KZ3HjiLydNoCDAGBLg5A/exec";
const kstDay = () => new Date().toLocaleDateString("sv-SE", { timeZone: "Asia/Seoul" });
const pad = (n, w) => String(n).padStart(w, "0");   // 자리를 넘으면 자릿수가 저절로 늘어나요
// ▼ 점수판 숫자: 오락기 점수처럼 뚝뚝 끊기며 올라가기 (점수판이 화면에 보일 때 시작)
function countUp(el, target, width) {
  const run = () => {
    const frames = 18, frameMs = 55;                 // 18칸 × 55ms ≈ 1초
    let f = 0;
    el.classList.remove("done");
    const tick = () => {
      f++;
      const t = 1 - Math.pow(1 - f / frames, 3);     // 처음엔 빠르게, 끝엔 천천히
      el.textContent = pad(Math.round(target * t), width);
      if (f < frames) setTimeout(tick, frameMs);
      else { void el.offsetWidth; el.classList.add("done"); }
    };
    el.textContent = pad(0, width);
    tick();
  };
  if (!("IntersectionObserver" in window)) return run();
  const io = new IntersectionObserver(es => {
    if (es.some(e => e.isIntersecting)) { io.disconnect(); run(); }
  }, { threshold: 0.6 });
  io.observe(el);
}
function showStats(d) {
  if (!d || typeof d.today !== "number") return;
  countUp($("sToday"), d.today, 4);
  countUp($("sTotal"), d.total, 6);
  badgeInfo = { todayBest: d.todayBest || null, hot: d.hot || [] };
  applyBadges();
}
if (STATS_URL) {
  $("score").hidden = false;
  let first = true;                                     // 이 기기에서 오늘 처음 열었는지
  try { first = localStorage.getItem("visitDay") !== kstDay(); localStorage.setItem("visitDay", kstDay()); } catch (e) {}
  fetch(STATS_URL + "?action=visit&first=" + (first ? 1 : 0))
    .then(r => r.json()).then(showStats).catch(() => {});
}
function logStart(name) {
  if (!STATS_URL) return;
  try { fetch(STATS_URL + "?action=start&game=" + encodeURIComponent(name), { mode: "no-cors", keepalive: true }); } catch (e) {}
}
let lastCab = null, curGame = null;
function needNote(g) {
  const el = $("gneed");
  if (!g || !g.login || !AA) { el.hidden = true; return; }
  const a = AA.get();
  el.hidden = false;
  el.innerHTML = a ? `<b>1P</b> <span></span>(으)로 시작해요` : `<b>1P LOGIN</b> 생각 오락실 계정으로 시작해요`;
  if (a) el.querySelector("span").textContent = a.nick;
}
function openGame(i, from) {
  const g = games[i]; lastCab = from; curGame = g;
  needNote(g);
  $("panel").style.setProperty("--c", g.color);
  $("gno").textContent = "GAME " + String(i + 1).padStart(2, "0");
  $("gthumb").innerHTML = g.thumb || "🎮";
  $("gname").textContent = g.name;
  $("gkind").textContent = g.subjects.join(" · ") + " · " + g.type;
  $("gdesc").textContent = g.desc;
  $("ggrade").innerHTML = gradeHTML(g);
  $("gtags").innerHTML = (g.tags || []).map(t => `<span>${t}</span>`).join("");
  $("gstart").href = g.url;
  $("dim").classList.add("open");
  $("gstart").focus();
}
function closeGame() { $("dim").classList.remove("open"); if (lastCab) lastCab.focus(); }
$("list").addEventListener("click", e => { const c = e.target.closest(".cab:not(.soon)"); if (c) openGame(+c.dataset.i, c); });
matchMedia("(min-width: 900px)").addEventListener("change", () => render());   // 화면 폭이 바뀌어 한 줄 칸 수가 달라지면 빈칸 다시 채우기
$("close").addEventListener("click", closeGame);
$("dim").addEventListener("click", e => { if (e.target.id === "dim") closeGame(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") closeGame(); });
$("gstart").addEventListener("click", e => {
  const g = curGame;
  if (g && g.login && AA && !AA.get()) {      // 로그인이 필요한 게임: 로그인 창을 먼저 띄우고, 끝나면 '시작' 버튼으로 새 창 열기
    e.preventDefault();
    closeGame();
    AA.open({ game: g.login, gameName: g.name, color: g.color,
      onPlay: () => { logStart(g.name); window.open(g.url, "_blank", "noopener"); } });
    return;
  }
  logStart(g ? g.name : $("gname").textContent);   // 번역된 화면 글자 대신 원래 이름으로 기록
  const f = $("flash"); f.style.setProperty("--c", $("panel").style.getPropertyValue("--c"));
  f.classList.remove("go"); void f.offsetWidth; f.classList.add("go");
  setTimeout(closeGame, 120);
});   // 새 창으로 연 뒤 안내 창은 닫아 두기
document.getElementById("tabs").addEventListener("click", e => {
  const b = e.target.closest(".tab"); if (!b) return;
  current = b.dataset.t;
  history.replaceState(null, "", current === "전체" ? location.pathname : "#" + encodeURIComponent(current));
  render();
});
document.getElementById("cnt").textContent = String(games.length).padStart(2, "0");
// ▼ 휴대폰으로 열기 QR: 지금 페이지 주소로 자동으로 만들어요
const pageUrl = location.origin + location.pathname;
function drawQR(canvas, scale, quiet) {
  if (typeof qrcode !== "function") return false;
  const qr = qrcode(0, "M"); qr.addData(pageUrl); qr.make();
  const n = qr.getModuleCount(), size = (n + quiet * 2) * scale;
  canvas.width = canvas.height = size;
  const ctx = canvas.getContext("2d");
  ctx.fillStyle = "#fff4c2"; ctx.fillRect(0, 0, size, size);
  const finder = (r, c) => (r < 7 && c < 7) || (r < 7 && c >= n - 7) || (r >= n - 7 && c < 7);
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) {
    if (!qr.isDark(r, c)) continue;
    ctx.fillStyle = finder(r, c) ? "#3a2a8c" : "#14112b";   // 모서리 눈은 보라, 나머지는 남색
    ctx.fillRect((c + quiet) * scale, (r + quiet) * scale, scale, scale);
  }
  return true;
}
if (!drawQR($("qrMini"), 2, 1)) $("qrBtn").style.display = "none";
$("qrBtn").addEventListener("click", () => {
  drawQR($("qrBig"), 8, 2);
  $("qrUrl").textContent = pageUrl;
  $("qrDim").classList.add("open");
  $("qrClose").focus();
});
const closeQR = () => { $("qrDim").classList.remove("open"); $("qrBtn").focus(); };
$("qrClose").addEventListener("click", closeQR);
$("qrDim").addEventListener("click", e => { if (e.target.id === "qrDim") closeQR(); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && $("qrDim").classList.contains("open")) closeQR(); });

// ▼ 통합 계정: 위쪽 1P 버튼과 안내
function showAccount(a) {
  if (!AA) return;
  const b = $("p1Btn");
  b.hidden = false;
  b.classList.toggle("in", !!a);
  b.textContent = a ? "1P " + a.nick : "1P LOGIN";
  const n = $("notice");
  n.hidden = false;
  const c = t => `<span class="ch">${t}</span>`;   // 덩어리 단위로만 줄이 바뀌게
  n.innerHTML = a
    ? `${c("<b>통합 계정</b>으로")} ${c("꼬들·셈들·가락 꼬들·퀸즈를")} ${c("모두 이어서 해요.")}<br>${c("게임마다 하던 예전 로그인은")} ${c(`<b>${AA.OLD_END}</b>까지만 돼요.`)} <button type="button" data-acc>내 계정</button>`
    : `${c("<b>NEW!</b> 이제 여기서")} ${c("<b>한 번만 로그인</b>하면")} <br class="m">${c("꼬들·셈들·가락 꼬들·퀸즈를")} ${c("이어서 해요.")}<br>${c("예전에 쓰던 닉네임과 비밀번호로")} ${c("가입하면 기록도 그대로!")}<br>${c("게임마다 하던 로그인은")} ${c(`<b>${AA.OLD_END}</b>까지만 돼요.`)} <button type="button" data-acc>로그인 · 가입</button>`;
  n.querySelector("[data-acc]").addEventListener("click", () => AA.open({}));
  if (curGame) needNote(curGame);
}
if (AA) {
  $("p1Btn").addEventListener("click", () => AA.open({}));
  AA.onChange(showAccount);
  showAccount(AA.get());
  if (AA.get()) AA.refresh();     // 연결 상태를 조용히 다시 받아 둠
}

render();
</script>
