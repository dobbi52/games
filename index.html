<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>생각 오락실</title>
<style>
  @font-face { font-family: 'Galmuri11'; src: url('https://cdn.jsdelivr.net/npm/galmuri@2.40.3/dist/Galmuri11.woff2') format('woff2'); font-display: swap; }
  @font-face { font-family: 'Galmuri11'; font-weight: 700; src: url('https://cdn.jsdelivr.net/npm/galmuri@2.40.3/dist/Galmuri11-Bold.woff2') format('woff2'); font-display: swap; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    word-break: keep-all;
    overflow-wrap: break-word;
    font-family: 'Galmuri11', monospace;
    background: #14112b;
    background-image:
      linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);
    background-size: 24px 24px;
    color: #f2f0ff;
    min-height: 100vh;
    padding: 44px 16px 56px;
    -webkit-font-smoothing: none;
  }
  body::after {
    content: ''; position: fixed; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(transparent 0 2px, rgba(0,0,0,.18) 2px 4px);
  }
  .wrap { max-width: 720px; margin: 0 auto; }
  @media (min-width: 900px) {
    .wrap { max-width: 980px; }
    .list { grid-template-columns: repeat(3, 1fr) !important; }
  }
  .hud { display: flex; justify-content: space-between; font-size: 14px; color: #8f88c9; margin-bottom: 30px; }
  .hud b { color: #ffd84a; font-weight: 400; }
  header { text-align: center; margin-bottom: 40px; }
  h1 {
    font-weight: 700;
    font-size: clamp(36px, 8.5vw, 56px);
    color: #ffd84a;
    text-shadow: 4px 4px 0 #e2457a, 8px 8px 0 #3a2a8c;
    letter-spacing: .02em;
    line-height: 1.25;
  }
  .press { margin-top: 18px; font-size: 18px; color: #6ef2d3; animation: blink 1.1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  .tabs { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-bottom: 34px; }
  .tab {
    font: inherit; font-size: 16px; font-weight: 700; cursor: pointer;
    background: #1f1a45; color: #bdb7e6;
    border: 3px solid #3a3470; padding: 9px 16px;
    box-shadow: 4px 4px 0 #0a0818;
  }
  .tab small { font-size: 13px; font-weight: 400; color: #8f88c9; margin-left: 4px; }
  .tab:hover { border-color: #6ef2d3; color: #f2f0ff; }
  .tab.on { background: #6ef2d3; border-color: #6ef2d3; color: #14112b; transform: translate(2px, 2px); box-shadow: 2px 2px 0 #0a0818; }
  .tab.on small { color: #14112b; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .chips span { font-size: 12px; color: #d9d4ff; border: 2px solid #3a3470; background: #0d0b20; padding: 3px 8px; }
  .chips span::before { content: '#'; color: var(--c); margin-right: 2px; }
  .empty { text-align: center; color: #8f88c9; padding: 30px 0; }
  .list { display: grid; grid-template-columns: repeat(2, 1fr); gap: 30px 22px; }
  .cab {
    font: inherit; cursor: pointer; text-align: center;
    display: flex; flex-direction: column; align-items: center;
    background: #1f1a45; color: inherit;
    padding: 30px 16px 20px;
    border: 4px solid var(--c);
    box-shadow: 6px 6px 0 #0a0818, 0 0 18px color-mix(in srgb, var(--c) 45%, transparent);
    position: relative;
  }
  .cab:hover, .cab:focus-visible { transform: translate(-2px, -2px); box-shadow: 8px 8px 0 #0a0818, 0 0 26px var(--c); outline: none; }
  .cab:active { transform: translate(2px, 2px); box-shadow: 3px 3px 0 #0a0818; }
  .no { position: absolute; top: -14px; left: 16px; background: var(--c); color: #14112b; font-size: 13px; font-weight: 700; padding: 3px 10px; }
  .thumb {
    flex-shrink: 0; width: 104px; height: 104px;
    background: #0d0b20; border: 3px solid #3a3470;
    display: grid; place-items: center;
  }
  .name { font-size: 24px; font-weight: 700; margin-top: 16px; }
  .cab .chips { justify-content: center; }

  /* 게임 안내 창 */
  .dim { position: fixed; inset: 0; z-index: 10; background: rgba(8, 6, 20, .78); display: none; place-items: center; padding: 16px; }
  .dim.open { display: grid; }
  .panel {
    width: 100%; max-width: 440px; max-height: calc(100vh - 32px); overflow-y: auto;
    background: #1f1a45; border: 4px solid var(--c);
    box-shadow: 8px 8px 0 #0a0818, 0 0 30px color-mix(in srgb, var(--c) 55%, transparent);
    padding: 34px 24px 26px; position: relative; text-align: center;
    animation: pop .16s steps(3);
  }
  @keyframes pop { from { transform: scale(.9); opacity: 0; } }
  .panel .no { top: 14px; left: 14px; }
  .panel { padding-top: 58px; }
  .x {
    position: absolute; top: 12px; right: 12px; font: inherit; font-size: 15px; font-weight: 700; cursor: pointer;
    width: 34px; height: 34px; background: #0d0b20; color: #bdb7e6; border: 3px solid #3a3470;
  }
  .x:hover { color: #fff; border-color: var(--c); }
  .panel .thumb { margin: 0 auto; width: 120px; height: 120px; }
  .panel h2 { font-size: 28px; margin-top: 16px; }
  .kind { margin-top: 8px; font-size: 14px; color: var(--c); }
  .about {
    margin-top: 18px; padding: 14px 16px; text-align: left;
    background: #0d0b20; border: 3px solid #3a3470;
    font-size: 15px; line-height: 1.75; color: #d9d4ff;
  }
  .panel .chips { justify-content: center; margin-top: 14px; }
  .start {
    display: block; margin-top: 22px; text-decoration: none;
    font-size: 20px; font-weight: 700; color: #14112b; background: var(--c);
    padding: 15px; box-shadow: 5px 5px 0 #0a0818;
  }
  .start::before { content: '▶'; display: inline-block; margin-right: 10px; }
  .start { position: relative; overflow: hidden; transition: transform .12s steps(2), box-shadow .12s steps(2), filter .12s; }
  .start::after {                       /* 반짝 지나가는 빛 */
    content: ''; position: absolute; top: 0; bottom: 0; left: -70px; width: 46px;
    background: rgba(255, 255, 255, .55); transform: skewX(-20deg); pointer-events: none;
  }
  .start:hover, .start:focus-visible {
    transform: translate(-3px, -3px); outline: none;
    box-shadow: 8px 8px 0 #0a0818, 0 0 26px var(--c), 0 0 0 3px #fff inset;
    filter: brightness(1.12);
  }
  .start:hover::before, .start:focus-visible::before { animation: nudge .45s steps(2) infinite; }
  .start:hover::after, .start:focus-visible::after { animation: shine .6s steps(8) both; }
  @keyframes nudge { 50% { transform: translateX(6px); } }
  @keyframes shine { to { left: calc(100% + 30px); } }
  .start:active { transform: translate(3px, 3px); box-shadow: 2px 2px 0 #0a0818; }
  .score { display: flex; justify-content: center; gap: 10px; margin-top: 20px; }
  .score[hidden] { display: none; }
  .score div {
    background: #0d0b20; border: 2px solid #3a3470; box-shadow: 3px 3px 0 #0a0818;
    padding: 4px 11px; display: flex; align-items: baseline; gap: 7px;
  }
  .score span { font-size: 11px; color: #8f88c9; }
  .score b { font-size: 16px; color: #ffd84a; letter-spacing: .08em; text-shadow: 0 0 6px rgba(255, 216, 74, .45); }
  footer { text-align: center; margin-top: 44px; font-size: 14px; color: #8f88c9; }
  footer b { color: #6ef2d3; font-weight: 400; animation: blink 1.1s steps(1) infinite; }

  .tiles { display: grid; grid-template-columns: repeat(3, 24px); gap: 5px; }
  .tiles span { width: 24px; height: 24px; display: grid; place-items: center; font-size: 14px; font-weight: 700; color: #14112b; }
  .t-g { background: #6ef28a; } .t-y { background: #ffd84a; } .t-n { background: #6d6894; }
  .grid4 { display: grid; grid-template-columns: repeat(4, 20px); gap: 2px; }
  .grid4 span { width: 20px; height: 20px; display: grid; place-items: center; font-size: 12px; }
  .m24 { display: grid; grid-template-columns: repeat(2, 30px); gap: 5px; position: relative; }
  .m24 span { width: 30px; height: 30px; display: grid; place-items: center; font-size: 16px; font-weight: 700; color: #14112b; background: #ffd84a; box-shadow: 2px 2px 0 #b8901a; }
  .m24 span:nth-child(2), .m24 span:nth-child(3) { background: #ff7aa8; box-shadow: 2px 2px 0 #b8456c; }
  .m24 b { position: absolute; right: -14px; bottom: -12px; background: #6ef2d3; color: #14112b; font-size: 13px; padding: 1px 4px; box-shadow: 2px 2px 0 #0a0818; }
  .xylo { display: flex; align-items: center; gap: 4px; }
  .xylo span { width: 13px; height: var(--h); background: var(--b); color: #14112b; font-size: 10px; font-weight: 700;
    display: flex; align-items: flex-end; justify-content: center; padding-bottom: 3px; box-shadow: 2px 2px 0 #0a0818; }
  .pair { display: grid; grid-template-columns: repeat(3, 24px); gap: 4px; }
  .pair span { width: 24px; height: 24px; display: grid; place-items: center; font-size: 14px; font-weight: 700; color: #d9f2ff; background: #24406b; border: 2px solid #3a6aa8; }
  .pair span.on { background: #5ec8ff; border-color: #bfeaff; color: #14112b; }
  @media (max-width: 600px) {
    /* 휴대폰: 윗부분 줄이기 */
    .hud { font-size: 12px; margin-bottom: 18px; }
    header { margin-bottom: 20px; }
    .press { margin-top: 12px; font-size: 16px; }
    .press-more { display: none; }
    .tabs { flex-wrap: nowrap; justify-content: flex-start; overflow-x: auto; gap: 5px;
            margin: 0 -16px 26px; padding: 0 16px 8px; scrollbar-width: none; }
    .tabs::-webkit-scrollbar { display: none; }
    .tab { flex: 0 0 auto; font-size: 13px; padding: 7px 7px; box-shadow: 3px 3px 0 #0a0818; }
    .tab small { font-size: 11px; margin-left: 2px; }
    .tabs::before, .tabs::after { content: ''; flex: 1 0 0; }   /* 한 줄에 들어가면 가운데 정렬 */
    .pair { grid-template-columns: repeat(3, 21px); }
    .pair span { width: 21px; height: 21px; font-size: 12px; }
    body { padding-top: 28px; }
    .list { gap: 26px 14px; }
    .cab { padding: 26px 10px 16px; }
    .thumb { width: 84px; height: 84px; }
    .tiles { grid-template-columns: repeat(3, 20px); gap: 4px; }
    .tiles span { width: 20px; height: 20px; font-size: 12px; }
    .grid4 { grid-template-columns: repeat(4, 17px); }
    .grid4 span { width: 17px; height: 17px; font-size: 10px; }
    .m24 { grid-template-columns: repeat(2, 26px); }
    .m24 span { width: 26px; height: 26px; font-size: 14px; }
    .name { font-size: 18px; margin-top: 12px; }
    .chips span { font-size: 11px; padding: 2px 6px; }
    .panel .thumb { width: 104px; height: 104px; }
  }
  .q1 { background: #9b6cff; } .q2 { background: #ff6c9e; } .q3 { background: #3fd6a8; } .q4 { background: #ffb84a; }

  /* ===== 애니메이션 ===== */
  /* 1) 제목이 위에서 떨어지며 튕기기 */
  h1 { animation: drop .8s cubic-bezier(.3, 1.4, .5, 1) both; }
  @keyframes drop {
    0% { transform: translateY(-140px); opacity: 0; }
    55% { transform: translateY(10px); opacity: 1; }
    75% { transform: translateY(-5px); }
    100% { transform: none; }
  }
  /* 2) 카드가 차례로 전원이 켜지듯 나타나기 */
  .cab { animation: boot .55s steps(6) backwards; animation-delay: calc(.35s + var(--n) * .12s); }
  @keyframes boot {
    0% { transform: scale(.2, .03); opacity: 0; filter: brightness(3); }
    40% { transform: scale(1, .03); opacity: 1; filter: brightness(3); }
    75% { transform: scale(1, 1.05); filter: brightness(1.4); }
    100% { transform: none; filter: none; }
  }
  /* 3) 네온 테두리 은은하게 깜빡이기 */
  .cab::after {
    content: ''; position: absolute; inset: -4px; pointer-events: none;
    box-shadow: 0 0 22px 2px var(--c);
    opacity: .25; animation: glow 2.8s ease-in-out infinite;
    animation-delay: calc(var(--n) * -.6s);
  }
  @keyframes glow { 50% { opacity: .6; } }
  /* 4) 안내 창이 화면 가운데에서 확 커지며 열리기 */
  .dim.open { animation: fadeIn .2s both; }
  @keyframes fadeIn { from { opacity: 0; } }
  .dim.open .panel { animation: crt .34s steps(7) both; }
  @keyframes crt {
    0% { transform: scale(.1, .02); opacity: 0; }
    45% { transform: scale(1, .02); opacity: 1; }
    100% { transform: none; }
  }
  /* 5) 게임 시작을 누르면 화면 번쩍 */
  #flash { position: fixed; inset: 0; z-index: 20; pointer-events: none; background: #fff; opacity: 0; }
  #flash.go { animation: flash .45s steps(4); }
  @keyframes flash { 0% { opacity: .9; } 50% { opacity: .35; background: var(--c, #fff); } 100% { opacity: 0; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="hud"><span>THIMBLE KING</span><span>GAMES <b id="cnt">02</b></span></div>
  <header>
    <h1>생각 오락실</h1>
    <p class="press">PRESS START<span class="press-more"> · 궁금한 게임을 눌러 보세요</span></p>
  </header>
  <nav class="tabs" id="tabs"></nav>
  <main class="list" id="list"></main>
  <footer>NEW GAME COMING SOON <b>_</b></footer>
  <div class="score" id="score" hidden>
    <div><span>TODAY</span><b id="sToday">---</b></div>
    <div><span>TOTAL</span><b id="sTotal">-----</b></div>
  </div>
</div>
<div id="flash"></div>
<div class="dim" id="dim">
  <div class="panel" id="panel" role="dialog" aria-modal="true" aria-labelledby="gname">
    <span class="no" id="gno"></span>
    <button class="x" id="close" aria-label="닫기">✕</button>
    <div class="thumb" id="gthumb"></div>
    <h2 id="gname"></h2>
    <div class="kind" id="gkind"></div>
    <p class="about" id="gdesc"></p>
    <div class="chips" id="gtags"></div>
    <a class="start" id="gstart" href="#" target="_blank" rel="noopener">게임 시작</a>
  </div>
</div>
<script>
// ▼ 게임 추가는 여기에 한 덩어리씩 넣으면 됩니다.
//   subjects: 교과(여러 개 가능) / type: 놀이 방식 / tags: 작은 표시
const games = [
  { name: "꼬들", subjects: ["국어"], type: "낱말 추리",
    desc: "한글 자모 6칸으로 숨은 낱말을 맞혀요. 친구들과 순위 경쟁도!",
    tags: ["순위표", "고학년 추천"],
    url: "https://dobbi52.github.io/kordle-challenge/", color: "#6ef28a",
    thumb: `<div class="tiles"><span class="t-g">ㄱ</span><span class="t-n">ㅏ</span><span class="t-y">ㅇ</span><span class="t-y">ㅇ</span><span class="t-g">ㅜ</span><span class="t-n">ㄹ</span></div>` },
  { name: "퀸즈", subjects: ["생각 놀이"], type: "퍼즐",
    desc: "색깔 구역마다 왕관을 하나씩! 규칙을 지키며 판을 채워요.",
    tags: ["오늘의 퍼즐", "연습 모드", "순위표"],
    url: "https://dobbi52.github.io/queens/", color: "#b18cff",
    thumb: `<div class="grid4"><span class="q1">👑</span><span class="q1"></span><span class="q2"></span><span class="q2"></span><span class="q1"></span><span class="q3"></span><span class="q2"></span><span class="q2">👑</span><span class="q3"></span><span class="q3"></span><span class="q4">👑</span><span class="q4"></span><span class="q3"></span><span class="q3">👑</span><span class="q4"></span><span class="q4"></span></div>` },
  { name: "셈들", subjects: ["수학", "생각 놀이"], type: "계산식 추리",
    desc: "숨어 있는 계산식을 맞혀요. 칸 수와 기회를 골라 도전해 봐요!",
    tags: ["난이도 조절"],
    url: "https://dobbi52.github.io/semdle/", color: "#ffb84a",
    thumb: `<div class="tiles"><span class="t-g">1</span><span class="t-n">2</span><span class="t-y">+</span><span class="t-y">9</span><span class="t-g">=</span><span class="t-g">8</span></div>` },
  { name: "24 만들기", subjects: ["수학", "생각 놀이"], type: "사칙연산 퍼즐",
    desc: "숫자 4개를 더하고 빼고 곱하고 나눠서 24를 만들어요. 시간 안에 몇 문제나 풀 수 있을까?",
    tags: ["연습 모드", "시간 도전", "순위표"],
    url: "https://dobbi52.github.io/make24/", color: "#ff7aa8",
    thumb: `<div class="m24"><span>3</span><span>8</span><span>4</span><span>6</span><b>24</b></div>` },
  { name: "숫자 짝꿍", subjects: ["수학", "생각 놀이"], type: "숫자 짝 찾기",
    desc: "같은 수끼리, 또는 더해서 10이 되는 수끼리 짝을 지어 지워요. 바로 옆이나 빈칸으로 이어진 타일만 짝이 될 수 있어요. 한 줄을 지우면 시간이 늘어나요!",
    tags: ["시간 도전", "힌트 3번", "순위표"],
    url: "https://dobbi52.github.io/jjakkung/", color: "#5ec8ff",
    thumb: `<div class="pair"><span>7</span><span class="on">3</span><span>5</span><span>2</span><span class="on">7</span><span>9</span><span>4</span><span>6</span><span>1</span></div>` },
  { name: "가락 꼬들", subjects: ["음악"], type: "가락 추리",
    desc: "노래 가락을 듣고 계이름을 맞혀요. 제출해야 소리가 들리니 귀를 쫑긋! 맞힌 자리는 초록, 다른 자리에 있으면 노랑으로 알려 줘요. 문제를 풀면 고양이 친구를 모을 수 있어요.",
    tags: ["오늘의 가락", "고양이 모으기", "고수 모드"],
    url: "https://dobbi52.github.io/garak/", color: "#ffe156",
    thumb: `<div class="xylo"><span style="--h:46px;--b:#ff6c6c">솔</span><span style="--h:40px;--b:#ffb84a">미</span><span style="--h:40px;--b:#ffb84a">미</span><span style="--h:34px;--b:#6ef28a">파</span><span style="--h:28px;--b:#5ec8ff">레</span></div>` },
];

// ▼ 탭 순서 (게임이 있는 교과만 화면에 나타나요)
const ORDER = ["국어", "수학", "사회", "과학", "영어", "음악", "미술", "체육", "생각 놀이"];

const subjects = ORDER.filter(s => games.some(g => g.subjects.includes(s)))
  .concat([...new Set(games.flatMap(g => g.subjects))].filter(s => !ORDER.includes(s)));
let current = decodeURIComponent(location.hash.slice(1));
if (!subjects.includes(current)) current = "전체";

function render() {
  const tabs = ["전체", ...subjects];
  document.getElementById("tabs").innerHTML = tabs.map(t => {
    const n = t === "전체" ? games.length : games.filter(g => g.subjects.includes(t)).length;
    return `<button class="tab${t === current ? " on" : ""}" data-t="${t}">${t}<small>${n}</small></button>`;
  }).join("");
  const shown = games.map((g, i) => ({ g, i })).filter(({ g }) => current === "전체" || g.subjects.includes(current));
  document.getElementById("list").innerHTML = shown.length ? shown.map(({ g, i }, k) => `
  <button class="cab" data-i="${i}" style="--c:${g.color};--n:${k}">
    <span class="no">GAME ${String(i + 1).padStart(2, "0")}</span>
    <div class="thumb">${g.thumb || "🎮"}</div>
    <div class="name">${g.name}</div>
    ${g.tags && g.tags.length ? `<div class="chips">${g.tags.map(t => `<span>${t}</span>`).join("")}</div>` : ""}
  </button>`).join("") : `<p class="empty">아직 게임이 없어요</p>`;
}
const $ = id => document.getElementById(id);

// ▼ 방문 기록: Apps Script 웹 앱 주소를 따옴표 안에 붙여 넣으세요. 비워 두면 점수판이 숨겨져요.
const STATS_URL = "https://script.google.com/macros/s/AKfycbx15D4z15tGhs9bwd_q1EVMZJI1dUk3DV0gqhj1NR81I4c682KZ3HjiLydNoCDAGBLg5A/exec";
const kstDay = () => new Date().toLocaleDateString("sv-SE", { timeZone: "Asia/Seoul" });
const pad = (n, w) => String(Math.min(n, 10 ** w - 1)).padStart(w, "0");
function showStats(d) {
  if (!d || typeof d.today !== "number") return;
  $("sToday").textContent = pad(d.today, 3);
  $("sTotal").textContent = pad(d.total, 5);
}
if (STATS_URL) {
  $("score").hidden = false;
  let first = true;                                     // 이 기기에서 오늘 처음 열었는지
  try { first = localStorage.getItem("visitDay") !== kstDay(); localStorage.setItem("visitDay", kstDay()); } catch (e) {}
  fetch(STATS_URL + "?action=visit&first=" + (first ? 1 : 0))
    .then(r => r.json()).then(showStats).catch(() => {});
}
function logStart(name) {
  if (!STATS_URL) return;
  try { fetch(STATS_URL + "?action=start&game=" + encodeURIComponent(name), { mode: "no-cors", keepalive: true }); } catch (e) {}
}
let lastCab = null;
function openGame(i, from) {
  const g = games[i]; lastCab = from;
  $("panel").style.setProperty("--c", g.color);
  $("gno").textContent = "GAME " + String(i + 1).padStart(2, "0");
  $("gthumb").innerHTML = g.thumb || "🎮";
  $("gname").textContent = g.name;
  $("gkind").textContent = g.subjects.join(" · ") + " · " + g.type;
  $("gdesc").textContent = g.desc;
  $("gtags").innerHTML = (g.tags || []).map(t => `<span>${t}</span>`).join("");
  $("gstart").href = g.url;
  $("dim").classList.add("open");
  $("gstart").focus();
}
function closeGame() { $("dim").classList.remove("open"); if (lastCab) lastCab.focus(); }
$("list").addEventListener("click", e => { const c = e.target.closest(".cab"); if (c) openGame(+c.dataset.i, c); });
$("close").addEventListener("click", closeGame);
$("dim").addEventListener("click", e => { if (e.target.id === "dim") closeGame(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") closeGame(); });
$("gstart").addEventListener("click", () => {
  logStart($("gname").textContent);
  const f = $("flash"); f.style.setProperty("--c", $("panel").style.getPropertyValue("--c"));
  f.classList.remove("go"); void f.offsetWidth; f.classList.add("go");
  setTimeout(closeGame, 120);
});   // 새 창으로 연 뒤 안내 창은 닫아 두기
document.getElementById("tabs").addEventListener("click", e => {
  const b = e.target.closest(".tab"); if (!b) return;
  current = b.dataset.t;
  history.replaceState(null, "", current === "전체" ? location.pathname : "#" + encodeURIComponent(current));
  render();
});
document.getElementById("cnt").textContent = String(games.length).padStart(2, "0");
render();
</script>
</body>
</html>
